<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figy</title>
  <link rel="icon" type="image/svg+xml" href="assets/figy_logo.svg">
  <link rel="shortcut icon" href="assets/figy_logo.svg">
  <link rel="stylesheet" href="src/styles/main.css">
</head>

<body>
  <div id="fileHeader">
    <img class="figy-logo" src="assets/figy_logo.svg" alt="" aria-hidden="true">
    <div class="file-title-section">
      <input id="fileName" type="text" value="Untitled" aria-label="File name" maxlength="80">
    </div>
  </div>

  <div id="workspaceActions" aria-label="Board actions">
    <span id="saveStatus" role="status">Opening...</span>
    <input id="boardSearch" type="search" placeholder="Find on board" aria-label="Find on board">
    <button id="undoBoard" title="Undo" aria-label="Undo"><i data-lucide="undo-2"></i></button>
    <button id="redoBoard" title="Redo" aria-label="Redo"><i data-lucide="redo-2"></i></button>
    <button id="fitBoard" title="Fit selection or board" aria-label="Fit selection or board"><i data-lucide="scan"></i></button>
    <div class="action-menu">
      <button id="alignBoard" title="Align selected objects" aria-label="Align selected objects" aria-expanded="false" aria-controls="alignMenu"><i data-lucide="align-start-vertical"></i></button>
      <div id="alignMenu" class="workspace-menu" role="menu" aria-label="Alignment options" hidden>
        <button type="button" data-align="left" title="Align left" aria-label="Align left" role="menuitem"><i data-lucide="align-start-vertical"></i></button>
        <button type="button" data-align="center" title="Align center" aria-label="Align center" role="menuitem"><i data-lucide="align-center-vertical"></i></button>
        <button type="button" data-align="right" title="Align right" aria-label="Align right" role="menuitem"><i data-lucide="align-end-vertical"></i></button>
      </div>
    </div>
    <button id="connectSelected" title="Connect two selected objects" aria-label="Connect two selected objects"><i data-lucide="move-right"></i></button>
    <button id="reviewBoard" title="Download review page" aria-label="Download review page"><i data-lucide="share-2"></i></button>
  </div>

  <div id="toolbar">
    <button id="selectTool" class="tool-button" title="Select" aria-label="Select tool">
      <img class="select-tool-icon" src="assets/basil_cursor-solid.svg" alt="">
      Select
    </button>
    <button id="panTool" class="tool-button" title="Pan" aria-label="Pan tool">
      <img class="pan-tool-icon" src="assets/Vector.svg" alt="">
      Pan
    </button>
    <span class="toolbar-divider" aria-hidden="true"></span>
    <div id="stickyTool" class="tool-menu">
      <button id="addSticky" class="tool-button" title="Add sticky note" aria-label="Add sticky note">
        <img class="sticky-tool-icon" src="assets/glyphs-poly_note-sticky-1.svg" alt="">
        Sticky
      </button>
      <div id="stickyToolMenu" class="sticky-tool-menu" aria-label="Sticky colors">
        <button type="button" data-color="yellow" title="Yellow" aria-label="Yellow sticky note"></button>
        <button type="button" data-color="pink" title="Pink" aria-label="Pink sticky note"></button>
        <button type="button" data-color="green" title="Green" aria-label="Green sticky note"></button>
        <button type="button" data-color="blue" title="Blue" aria-label="Blue sticky note"></button>
        <button type="button" data-color="orange" title="Orange" aria-label="Orange sticky note"></button>
        <button type="button" data-color="purple" title="Purple" aria-label="Purple sticky note"></button>
        <button type="button" data-color="white" title="White" aria-label="White sticky note"></button>
        <button type="button" data-color="gray" title="Gray" aria-label="Gray sticky note"></button>
      </div>
    </div>
    <button id="addText" class="tool-button" title="Text tool" aria-label="Text tool">
      <span class="text-tool-icon">T</span>
      Text
    </button>
    <div id="pencilTool" class="tool-menu">
      <button id="addPencil" class="tool-button" title="Pencil tool" aria-label="Pencil tool">
        <img class="pencil-tool-icon" src="assets/emojione_pencil.svg" alt="">
        Pencil
      </button>
      <div id="pencilMenu" class="pencil-menu" aria-label="Pencil settings">
        <div class="pencil-colors" aria-label="Pencil colors">
          <button type="button" data-pencil-color="#1f1f1f" style="--pencil-color: #1f1f1f" title="Black" aria-label="Black pencil"></button>
          <button type="button" data-pencil-color="#ef4444" style="--pencil-color: #ef4444" title="Red" aria-label="Red pencil"></button>
          <button type="button" data-pencil-color="#f97316" style="--pencil-color: #f97316" title="Orange" aria-label="Orange pencil"></button>
          <button type="button" data-pencil-color="#22c55e" style="--pencil-color: #22c55e" title="Green" aria-label="Green pencil"></button>
          <button type="button" data-pencil-color="#0ea5e9" style="--pencil-color: #0ea5e9" title="Blue" aria-label="Blue pencil"></button>
          <button type="button" data-pencil-color="#8b5cf6" style="--pencil-color: #8b5cf6" title="Purple" aria-label="Purple pencil"></button>
        </div>
        <label class="pencil-width-control">
          <span>Width</span>
          <input id="pencilWidth" type="range" min="2" max="18" step="1" value="4">
          <output id="pencilWidthValue">4</output>
        </label>
      </div>
    </div>
    <button id="addEraser" class="tool-button" title="Eraser tool" aria-label="Eraser tool">
      <img class="eraser-tool-icon" src="assets/solar_eraser-bold.svg" alt="">
      Eraser
    </button>
    <div id="shapeTool" class="tool-menu">
      <button id="addShape" class="tool-button" title="Shapes" aria-label="Shapes">
        <img class="shape-tool-icon" src="assets/fa7-solid_shapes.svg" alt="">
        Shapes
      </button>
      <div id="shapeMenu" class="shape-menu" aria-label="Shape options">
        <button type="button" data-shape="circle" title="Circle" aria-label="Circle">
          <svg class="shape-option-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8"></circle>
          </svg>
        </button>
        <button type="button" data-shape="square" title="Square" aria-label="Square">
          <svg class="shape-option-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="5" width="14" height="14"></rect>
          </svg>
        </button>
        <button type="button" data-shape="triangle" title="Triangle" aria-label="Triangle">
          <svg class="shape-option-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5.5 20 19H4Z"></path>
          </svg>
        </button>
        <button type="button" data-shape="star" title="Star" aria-label="Star">
          <svg class="shape-option-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m12 4.5 2.25 4.75 5.25.67-3.85 3.6.98 5.18L12 16.15 7.37 18.7l.98-5.18-3.85-3.6 5.25-.67Z"></path>
          </svg>
        </button>
        <button type="button" data-shape="pentagon" title="Pentagon" aria-label="Pentagon">
          <svg class="shape-option-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4.5 19.5 10l-2.9 9H7.4l-2.9-9Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="board">
    <div id="canvas">
      <svg id="drawLayer"></svg>
    </div>
  </div>

  <button id="chatToggle" class="chat-toggle" type="button" title="Open chatbot" aria-label="Open chatbot">
    AI
  </button>

  <section id="chatPanel" class="chat-panel" aria-label="Figy chatbot" aria-hidden="true">
    <header class="chat-header">
      <div>
        <strong><img class="chat-logo" src="assets/figy_logo.svg" alt="" aria-hidden="true">Figy AI</strong>
        <span>Board helper</span>
      </div>
      <div class="chat-header-actions">
        <div id="modelSettings" class="model-settings">
          <button id="modelSettingsButton" type="button" title="AI model settings" aria-label="AI model settings" aria-expanded="false">
            <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"></path>
              <path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.06.06a2.1 2.1 0 0 1-2.96 2.96l-.06-.06a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.08 1.64v.18a2.1 2.1 0 0 1-4.2 0v-.1a1.8 1.8 0 0 0-1.18-1.68 1.8 1.8 0 0 0-1.98.36l-.06.06a2.1 2.1 0 0 1-2.96-2.96l.06-.06A1.8 1.8 0 0 0 4.6 15a1.8 1.8 0 0 0-1.64-1.08h-.18a2.1 2.1 0 0 1 0-4.2h.1A1.8 1.8 0 0 0 4.56 8.54a1.8 1.8 0 0 0-.36-1.98l-.06-.06A2.1 2.1 0 0 1 7.1 3.54l.06.06a1.8 1.8 0 0 0 1.98.36h.08A1.8 1.8 0 0 0 10.28 2.3v-.1a2.1 2.1 0 0 1 4.2 0v.1a1.8 1.8 0 0 0 1.08 1.64 1.8 1.8 0 0 0 1.98-.36l.06-.06a2.1 2.1 0 0 1 2.96 2.96l-.06.06a1.8 1.8 0 0 0-.36 1.98v.08a1.8 1.8 0 0 0 1.64 1.08h.18a2.1 2.1 0 0 1 0 4.2h-.18A1.8 1.8 0 0 0 19.4 15Z"></path>
            </svg>
          </button>
          <div id="modelSettingsMenu" class="model-settings-menu" aria-label="AI model settings">
            <label for="aiModelSelect">Model</label>
            <select id="aiModelSelect">
              <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
              <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
              <option value="openai/gpt-oss-120b">GPT OSS 120B</option>
              <option value="Qwen/Qwen3.8-2.4T-A95B">Qwen 3.8 2.4T A95B</option>
              <option value="deepseek-ai/DeepSeek-V4-Pro">DeepSeek V4 Pro</option>
            </select>
          </div>
        </div>
        <button id="chatClose" type="button" title="Close chatbot" aria-label="Close chatbot">x</button>
      </div>
    </header>
    <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
    <form id="chatForm" class="chat-form">
      <label class="selection-context"><input id="useSelection" type="checkbox" checked> Include selected objects</label>
      <textarea id="chatInput" rows="1" placeholder="Ask about your board..." aria-label="Chat message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <div id="zoomControls" aria-label="Board zoom controls">
    <button id="themeToggle" class="theme-switch" type="button" title="Switch to dark mode" aria-label="Switch to dark mode" aria-pressed="false">
      <img class="theme-icon sun-icon" src="assets/akar-icons_sun-fill.svg" alt="" aria-hidden="true">
      <img class="theme-icon moon-icon" src="assets/ant-design_moon-filled.svg" alt="" aria-hidden="true">
      <span class="theme-switch-thumb"></span>
    </button>
    <button id="zoomOut" type="button" title="Zoom out" aria-label="Zoom out">-</button>
    <label class="zoom-input-wrap" aria-label="Zoom percentage">
      <input id="zoomLevel" type="number" min="2" max="200" step="1" value="100">
      <span>%</span>
    </label>
    <button id="zoomIn" type="button" title="Zoom in" aria-label="Zoom in">+</button>
  </div>

  <dialog id="flowPreview" aria-labelledby="previewTitle">
    <header><strong id="previewTitle">Flow preview</strong><div class="preview-tools"><button id="previewZoomOut" title="Zoom preview out" aria-label="Zoom preview out"><i data-lucide="minus"></i></button><button id="previewFit" title="Fit preview" aria-label="Fit preview"><i data-lucide="scan"></i></button><button id="previewZoomIn" title="Zoom preview in" aria-label="Zoom preview in"><i data-lucide="plus"></i></button><button id="closePreview" title="Close preview" aria-label="Close preview"><i data-lucide="x"></i></button></div></header>
    <div id="previewError" role="status"></div>
    <div id="previewDrawing"></div>
    <label for="previewAssumptions">Assumptions</label><textarea id="previewAssumptions" rows="2"></textarea>
    <footer><button id="simplifyFlow">Simplify</button><button id="expandFlow">Add exception paths</button><button id="reviseFlow">Apply assumptions</button><button id="insertFlow">Insert flow</button></footer>
  </dialog>
  <script src="assets/vendor/elk.bundled.js"></script>
  <script src="assets/vendor/lucide.js"></script>
  <script src="src/shared/graph.js"></script>
  <script src="src/js/flowLayout.js"></script>
  <script src="src/js/aiClient.js"></script>
  <script src="src/js/board.js"></script>
  <script src="src/js/chat.js"></script>
  <script src="src/js/workspace.js"></script>
  <script src="src/js/flowPreview.js"></script>
</body>
</html>
